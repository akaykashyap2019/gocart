apiVersion: apps/v1
kind: Deployment
metadata:
  name: gocart-deployment
  labels:
    app: gocart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gocart
  template:
    metadata:
      labels:
        app: gocart
    spec:
      containers:
      - name: gocart
        image: monodakay/gocart:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gocart-service
spec:
  type: NodePort
  selector:
    app: gocart
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080
---
# Ingress routes default port 80 traffic into the service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gocart-ingress
  annotations:
    ingress.class: traefik
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gocart-service
            port:
              number: 80

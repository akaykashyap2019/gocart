apiVersion: apps/v1
kind: Deployment
metadata:
  name: gocart-deployment
  labels:
    app: gocart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gocart
  template:
    metadata:
      labels:
        app: gocart
    spec:
      containers:
      - name: gocart
        image: monodakay/gocart:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        # CRITICAL: HPA requires resource requests and limits to calculate CPU%
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gocart-service
spec:
  type: NodePort
  selector:
    app: gocart
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080